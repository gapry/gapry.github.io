title: Gapry's Blog

email: gapry [at] protonmail [dot] com

description: ""

baseurl: "" 

url: "" 

twitter_username: ""

github_username:  ""

theme: minimal-mistakes-jekyll

future: true

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-4DG3HSBT1T"
    anonymize_ip: true

plugins:
  - jekyll-feed

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - bpc/
  - .nojekyll
  - install.sh
  - test.sh

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: https://github.com/gapry
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: https://twitter.com/_gapry
