---
layout: archive
---

{% include google-analytics.html %}

<div class="home">
  <h1>Latest Posts</h1>
  <ul class="post-list">
    {% for post in site.posts limit:10 %}
      <li>
        <a href="{{ post.url }}">[{{ post.date | date: "%Y-%m-%d" }}] --- {{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
  <div class="page-content">
    {{ content }}
  </div>
</div>
